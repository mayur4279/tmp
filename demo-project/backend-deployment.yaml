apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: employee-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-backend
  template:
    metadata:
      labels:
        app: employee-backend
    spec:
      containers:
      - name: backend
        image: mayur4279/employee-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: "localhost"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "password"
        - name: DB_NAME
          value: "employee_management"
        - name: DB_PORT
          value: "5432"
        - name: ALLOWED_ORIGINS
          value: "*"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: employee-backend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
  type: NodePort